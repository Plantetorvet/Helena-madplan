<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌾 Helenas Glutenfri Køkken</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4faf7;
  padding:40px;
  max-width:700px;
  margin:auto;
}

h1{
  color:#1D9E75;
}

button{
  background:#1D9E75;
  color:white;
  border:none;
  padding:15px 25px;
  border-radius:10px;
  cursor:pointer;
  font-size:18px;
}

button:hover{
  background:#14795a;
}

#output{
  margin-top:30px;
  background:white;
  padding:20px;
  border-radius:12px;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<h1>🌾 Helenas Glutenfri Køkken</h1>

<p>Klik for at lave en glutenfri madplan.</p>

<button onclick="generatePlan()">✨ Lav min madplan</button>

<div id="output"></div>

<script>
async function generatePlan() {

  document.getElementById('output').innerHTML =
    '⏳ Genererer madplan...';

  const prompt =
    'Lav en glutenfri madplan for 3 dage på dansk';

  try {

    const response = await fetch('/api/generate-plan', {
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify({ prompt })
    });

    const data = await response.json();
    const text = data.content?.[0]?.text || 'Der kom ikke noget svar.';
    document.getElementById('output').innerHTML = text.replace(/\n/g, '<br>');
      

  } catch(err){

    document.getElementById('output').innerHTML =
      'Fejl: ' + err.message;
  }
}
</script>

</body>
</html>
